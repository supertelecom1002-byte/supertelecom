<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      (function(){
        if (typeof window === 'undefined') return;
        var VER = 'st_v5_0';
        try {
          if (localStorage.getItem('st_cache_gen') !== VER) {
            localStorage.setItem('st_cache_gen', VER);
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) {
                  if (k !== 'supertelecom-offline-v5.0') caches.delete(k);
                });
              });
            }
          }
        } catch(e) {}
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (typeof msg === 'string' && (msg.indexOf('inView') !== -1 || msg.indexOf('routes-') !== -1 || msg.indexOf('Loading chunk') !== -1 || msg.indexOf('is not defined') !== -1)) {
            var key = 'st_auto_wipe_ts';
            var last = parseInt(sessionStorage.getItem(key) || '0', 10);
            var now = Date.now();
            if (now - last > 10000) {
              sessionStorage.setItem(key, String(now));
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  regs.forEach(function(r) { r.unregister(); });
                });
              }
              if ('caches' in window) {
                caches.keys().then(function(keys) {
                  Promise.all(keys.map(function(k) { return caches.delete(k); })).finally(function() {
                    window.location.replace(window.location.origin + window.location.pathname + '?_fresh=' + now);
                  });
                });
              } else {
                window.location.replace(window.location.origin + window.location.pathname + '?_fresh=' + now);
              }
            }
          }
        });
      })();
    </script>
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="google-site-verification" content="htat_gsc_wwwsuperte_bagd36tlh1" />
    <meta name="google-site-verification" content="htat_gsc_supertelec_mrm60cg0mv" />
    <title>Super Telecom | Flagship Mobile Repair Lab Giridih</title>
    <meta name="description" content="Giridih flagship smartphone and chip-level micro soldering repair lab." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
  </head>
  <body class="dark bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
